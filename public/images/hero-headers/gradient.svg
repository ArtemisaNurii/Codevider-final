<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" fill="none" role="img" aria-label="Hero gradient background">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="rgba(43,127,255,0.35)"/>
      <stop offset="60%" stop-color="rgba(43,127,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="rgba(0,201,167,0.12)"/>
      <stop offset="55%" stop-color="rgba(0,201,167,0)"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="520" fill="url(#bg)"/>
  <rect width="1440" height="520" fill="url(#glow-blue)"/>
  <rect width="1440" height="520" fill="url(#glow-teal)"/>
